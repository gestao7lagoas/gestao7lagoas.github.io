/* ===========================================================================

 * ===========================================================================
 *  JavaScript puro. Toda conversa com o servidor passa por `chamar`, que

/* ---------------------------------------------------------------------------
 * Ponte com a API do Apps Script.
 *
 * O corpo vai como "text/plain" de propósito: assim o navegador trata a
 * chamada como requisição simples e não manda o OPTIONS de verificação prévia,
 * que o Apps Script não sabe responder. O conteúdo continua sendo JSON.
 * ------------------------------------------------------------------------ */

var CHAVE_TOKEN = 'paipe.sessao';

function enderecoApi() {
  return (window.PAIPE_CONFIG && window.PAIPE_CONFIG.api) || '';
}

function tokenAtual() {
  try { return localStorage.getItem(CHAVE_TOKEN) || ''; } catch (e) { return ''; }
}

function guardarToken(t) {
  try { t ? localStorage.setItem(CHAVE_TOKEN, t) : localStorage.removeItem(CHAVE_TOKEN); } catch (e) {}
}

/** Nome da função do projeto -> nomes dos argumentos, na ordem. */
var ARGUMENTOS_API = {
  api_meta: [], api_notificacoes: [], api_relatorios: [], api_usuarios: [],
  api_lacunas: [], api_verificarPrazos: [], api_formularioPublico: [],
  api_quadro: ['filtros', 'porFase'],

  api_kpi: ['filtros'],

  api_relatorio: ['chave', 'filtros', 'limite'],

  api_definirSenhaDe: ['email', 'senha'],
  api_auditoria: ['pagina', 'tamanho'],
  api_enviarFormularioPublico: ['dados'],
  api_trocarSenha: ['senhaAtual', 'senhaNova'],
  api_login: ['email', 'senha']
};

function enviarApi(acao, argumentos) {
  var endereco = enderecoApi();
  if (!endereco || endereco.indexOf('http') !== 0) {
    return Promise.reject(new Error('O endereço da API não foi configurado. Edite o arquivo config.js.'));
  }
  return fetch(endereco, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    redirect: 'follow',
    body: JSON.stringify({ acao: acao, argumentos: argumentos || {}, token: tokenAtual() })
  })
    .then(function (r) { return r.text(); })
    .then(function (texto) {
      var resposta;
      try {
        resposta = JSON.parse(texto);
      } catch (e) {
        throw new Error('Resposta inesperada do servidor. Confira o endereço em config.js e se a implantação está como "Qualquer pessoa".');
      }
      if (!resposta.ok) {
        if (resposta.sessaoInvalida) {
          guardarToken(null);
          if (typeof mostrarLogin === 'function') mostrarLogin('Sua sessão expirou. Entre de novo.');
        }
        throw new Error(resposta.erro || 'Não foi possível concluir a operação.');
      }
      return resposta.dados;
    });
}

function chamar(nome) {
  var args = Array.prototype.slice.call(arguments, 1);

  // o formulário público é a mesma página, na rota #formulario
  if (nome === 'api_linkFormulario') {
    return Promise.resolve({ url: location.href.split('#')[0] + '#formulario', implantado: true });
  }

  var nomes = ARGUMENTOS_API[nome];
  if (!nomes) return Promise.reject(new Error('Ação não mapeada no site: ' + nome));
  var argumentos = {};
  for (var i = 0; i < nomes.length; i++) {
    if (args[i] !== undefined) argumentos[nomes[i]] = args[i];
  }
  return enviarApi(nome.replace(/^api_/, ''), argumentos);
}

function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

function el(id) { return document.getElementById(id); }

function dataCurta(v) {
  if (!v) return '—';
  var d = new Date(v);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('pt-BR', { timeZone: 'UTC' });
}

function dataHora(v) {
  if (!v) return '—';
  var d = new Date(v);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleString('pt-BR', {
    timeZone: 'UTC', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
  });
}

var MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

function seloVencimento(v) {
  if (!v) return '';
  var d = new Date(v);
  return 'Venc ' + MESES[d.getUTCMonth()] + ', ' + d.getUTCDate();
}

function distancia(v) {
  if (!v) return '';
  var dif = Math.round((Date.now() - new Date(v).getTime()) / 86400000);
  if (dif === 0) return 'hoje';
  var n = Math.abs(dif);
  if (n < 30) return (dif > 0 ? 'há ' : 'em ') + n + ' dia' + (n > 1 ? 's' : '');
  var m = Math.round(n / 30);
  if (m < 12) return (dif > 0 ? 'há ' : 'em ') + m + (m > 1 ? ' meses' : ' mês');
  var a = Math.round(n / 365);
  return (dif > 0 ? 'há ' : 'em ') + a + ' ano' + (a > 1 ? 's' : '');
}

function num(v, casas) {
  if (v === null || v === undefined || isNaN(v)) return '—';
  return Number(v).toLocaleString('pt-BR', {
    minimumFractionDigits: casas || 0, maximumFractionDigits: casas || 0
  });
}

function pct(v) { return v === null || v === undefined ? '—' : Number(v).toFixed(1) + '%'; }

    case 'mapa': return telaFluxo(true);
    case 'fluxo': return telaFluxo(false);
    case 'acoes': return telaAcoes();
    case 'gerenciar': return telaGerenciar();
    case 'aprendizado': return telaAprendizado();
    default: return telaKanban();
  }
}

// ------------------------------- navegação ---------------------------------

function irPara(aba) {
  E.aba = aba;
  desenhar();
  carregarAba();
}

function aoBuscar(v) {
  E.busca = v;
  clearTimeout(aoBuscar._t);
  aoBuscar._t = setTimeout(function () { carregarAba(true); }, 450);
}

function alternarFiltros() {
  E.filtrosAbertos = !E.filtrosAbertos;
  desenhar();
}

function filtrosAtivos() {
  var f = {};
  Object.keys(E.filtros).forEach(function (k) { if (E.filtros[k]) f[k] = E.filtros[k]; });
  if (E.busca && E.busca.trim()) f.q = E.busca.trim();
  return f;
}

function definirFiltro(campo, valor) {
  E.filtros[campo] = valor;
  carregarAba(true);
}

function limparFiltros() {
  E.filtros = {};
  E.busca = '';
  carregarAba(true);
}

function barraFiltros() {
  var m = E.meta || {};
  var sel = function (campo, rotulo, itens) {
    return '<div><label class="rotulo">' + rotulo + '</label>' +
      '<select class="campo w-48 py-1.5" onchange="definirFiltro(\'' + campo + '\', this.value)">' +
      '<option value="">Todos</option>' +
      (itens || []).map(function (i) {
        var nome = i.nome !== undefined ? i.nome : i;
        return '<option value="' + esc(nome) + '"' + (E.filtros[campo] === nome ? ' selected' : '') + '>' + esc(nome) + '</option>';
      }).join('') +
      '</select></div>';
  };
  var ativos = Object.keys(E.filtros).filter(function (k) { return E.filtros[k] && k !== 'campoData'; }).length;

  return '<div class="flex flex-wrap items-end gap-3 border-t border-paipe-borda bg-slate-50 px-5 py-3">' +
    sel('unidade', 'Unidade', m.unidades) +
    sel('area', 'Área', m.areas) +
    sel('setor', 'Setor', m.setores) +
    sel('categoria', 'Categoria', m.categorias) +
    sel('criticidade', 'Criticidade', m.criticidades) +
    sel('etiqueta', 'Etiqueta', (m.etiquetas || []).map(function (e) { return { nome: e.nome }; })) +
    '<div><label class="rotulo">Responsável</label>' +
      '<input class="campo w-44 py-1.5" value="' + esc(E.filtros.responsavel || '') + '" placeholder="Nome" ' +
      'onchange="definirFiltro(\'responsavel\', this.value)" /></div>' +
    '<div><label class="rotulo">Situação</label>' +
      '<select class="campo w-40 py-1.5" onchange="definirFiltro(\'situacao\', this.value)">' +
      ['', 'ATRASADOS', 'NO_PRAZO', 'SEM_PRAZO'].map(function (v) {
        var r = { '': 'Todas', ATRASADOS: 'Atrasados', NO_PRAZO: 'No prazo', SEM_PRAZO: 'Sem prazo' }[v];
        return '<option value="' + v + '"' + (E.filtros.situacao === v ? ' selected' : '') + '>' + r + '</option>';
      }).join('') + '</select></div>' +
    '<div><label class="rotulo">Período por</label>' +
      '<select class="campo w-44 py-1.5" onchange="definirFiltro(\'campoData\', this.value)">' +
      [['ocorridoEm', 'Data da ocorrência'], ['criadoEm', 'Data de criação'], ['concluidoEm', 'Data de conclusão'], ['prazoFinalPlano', 'Prazo final do plano']]
        .map(function (p) {
          return '<option value="' + p[0] + '"' + ((E.filtros.campoData || 'ocorridoEm') === p[0] ? ' selected' : '') + '>' + p[1] + '</option>';
        }).join('') + '</select></div>' +
    '<div><label class="rotulo">De</label><input type="date" class="campo w-36 py-1.5" value="' + esc(E.filtros.de || '') + '" onchange="definirFiltro(\'de\', this.value)" /></div>' +
    '<div><label class="rotulo">Até</label><input type="date" class="campo w-36 py-1.5" value="' + esc(E.filtros.ate || '') + '" onchange="definirFiltro(\'ate\', this.value)" /></div>' +
    (ativos ? '<button class="botao" onclick="limparFiltros()">' + icone('fechar', 14) + ' Limpar (' + ativos + ')</button>' : '') +
    '</div>';
}

// --------------------------- carregamento por aba --------------------------

function carregarAba(recarregar) {
  ocupado(true);
  var p;
  switch (E.aba) {
    case 'kanban':
      p = chamar('api_quadro', filtrosAtivos(), 25).then(function (r) { E.quadro = r; });
      break;
    case 'lista':
      if (recarregar) E.listaPagina = 1;
      p = chamar('api_lista', filtrosAtivos(), E.listaPagina, 50, E.listaOrdem).then(function (r) { E.lista = r; });
      break;
    case 'paineis':
      p = chamar('api_kpi', filtrosAtivos()).then(function (r) { E.kpi = r; });
      break;
    case 'acoes':
      p = chamar('api_acoes', Object.assign({}, E.acoesFiltro)).then(function (r) { E.acoes = r; });
      break;
    case 'relatorios':
      p = E.relatorioAtual
        ? chamar('api_relatorio', E.relatorioAtual, filtrosAtivos(), 500).then(function (r) { E.relatorioDados = r; })
        : chamar('api_relatorios').then(function (r) { E.relatorios = r; });
      break;
    case 'emails':
      p = chamar('api_notificacoes').then(function (r) { E.notificacoes = r; });
      break;
    case 'gerenciar':
      p = carregarGerenciar();
      break;
    default:
      p = Promise.resolve();
  }
  return p.then(function () {
    ocupado(false);
    desenhar();
  }).catch(function (e) {
    ocupado(false);
    aviso(e.message, 'erro');
    desenhar();
  });
}

// ------------------------------- inicialização -----------------------------

function iniciar() {
  chamar('api_meta')
    .then(function (meta) {
      E.meta = meta;
      return chamar('api_notificacoes').catch(function () { return []; });
    })
    .then(function (n) {
      E.notificacoes = n || [];
      desenhar();
      return carregarAba();
    })
    .catch(function (e) {
      el('raiz').innerHTML =
        '<div class="grid min-h-screen place-items-center p-6"><div class="painel max-w-lg p-6 text-center">' +
        '<p class="text-lg font-semibold text-red-600">Não foi possível abrir o Paipe</p>' +

        '</div></div>';
    });
}

    '<dl class="mt-2 space-y-1.5">' +
      linhaCard('calendario', 'DATA E HORA DA OCORRÊNCIA:', dataHora(d.ocorridoEm)) +
      (d.responsavelPreenchimento ? linhaCard('usuario', 'RESPONSÁVEL PELO PREENCHIMENTO:', d.responsavelPreenchimento) : '') +
    '</dl>' +
    (d.vencimentoEm ?
      '<div class="mt-2 flex items-center gap-2 text-[11px]">' +
        '<span class="text-paipe-suave">' + icone('calendario', 12) + '</span>' +
        '<span class="rounded px-1.5 py-0.5 font-semibold ' + (d.atrasado ? 'bg-red-100 text-red-700' : 'bg-slate-100 text-slate-600') + '">' + esc(seloVencimento(d.vencimentoEm)) + '</span>' +

function linhaCard(ico, rotulo, valor) {

function carregarMais(fase, jaCarregados) {
  event.stopPropagation();
  ocupado(true);
  chamar('api_colunaKanban', fase, filtrosAtivos(), jaCarregados, 25)
    .then(function (r) {
      E.quadro.colunas.forEach(function (c) {
        if (c.fase.nome === fase) c.cards = c.cards.concat(r.cards);
      });
      ocupado(false);
      desenhar();
    })
    .catch(function (e) { ocupado(false); aviso(e.message, 'erro'); });
}

/** Arrastar e soltar entre colunas, respeitando as transições do fluxo. */
function ligarArrastar() {
  if (!E.meta.usuario.podeEditar) return;
  var arrastando = null;

  document.querySelectorAll('[data-codigo]').forEach(function (card) {
    card.addEventListener('dragstart', function (ev) {
      arrastando = { codigo: card.dataset.codigo, fase: card.closest('[data-fase]').dataset.fase };
      ev.dataTransfer.setData('text/plain', card.dataset.codigo);
      ev.dataTransfer.effectAllowed = 'move';
    });
  });

  document.querySelectorAll('[data-coluna]').forEach(function (coluna) {
    var secao = coluna.closest('[data-fase]');
    coluna.addEventListener('dragover', function (ev) {
      if (!arrastando || !permitida(arrastando.fase, secao.dataset.fase)) return;
      ev.preventDefault();
      secao.classList.add('border-paipe-azul', 'bg-blue-50/60');
    });
    coluna.addEventListener('dragleave', function () {
      secao.classList.remove('border-paipe-azul', 'bg-blue-50/60');
    });
    coluna.addEventListener('drop', function (ev) {
      ev.preventDefault();
      secao.classList.remove('border-paipe-azul', 'bg-blue-50/60');
      if (!arrastando) return;
      var destino = secao.dataset.fase;
      var origem = arrastando.fase;
      var codigo = arrastando.codigo;
      arrastando = null;
      if (origem === destino) return;
      if (!permitida(origem, destino)) {
        aviso('Transição de "' + origem + '" para "' + destino + '" não é permitida pelo fluxo.', 'erro');
        return;
      }
      moverCard(codigo, destino);
    });
  });
}

function permitida(de, para) {
  var papel = E.meta.usuario.papel;
  return (E.meta.transicoes || []).some(function (t) {
    return t.de === de && t.para === para && t.perfis.indexOf(papel) >= 0;
  });
}

function moverCard(codigo, fase) {
  ocupado(true);
  chamar('api_moverFase', codigo, fase, '')
    .then(function () {
      aviso('Card ' + codigo + ' movido para ' + fase + '.', 'ok');
      return carregarAba();
    })
    .catch(function (e) { ocupado(false); aviso(e.message, 'erro'); });
}

/** Barras horizontais proporcionais. */
function barras(itens, cor) {
  if (!itens || !itens.length) return '<p class="text-sm text-paipe-suave">Sem dados.</p>';
  var max = Math.max.apply(null, itens.map(function (i) { return i.total; }));
  return '<div class="space-y-2">' + itens.slice(0, 10).map(function (i) {
    var largura = max ? Math.max((i.total / max) * 100, 2) : 0;
    return '<div>' +
      '<div class="flex justify-between text-xs"><span class="truncate pr-2">' + esc(i.nome) + '</span><span class="font-semibold">' + num(i.total) + '</span></div>' +
      '<div class="h-2.5 w-full rounded bg-slate-100"><div class="h-2.5 rounded" style="width:' + largura + '%;background:' + esc(i.cor || cor) + '"></div></div>' +
      '</div>';
  }).join('') + '</div>';
}

/** Barras por fase, com o tempo médio ao lado. */
function barrasFase(fases) {
  var max = Math.max.apply(null, fases.map(function (f) { return f.total; }).concat([1]));
  return '<div class="space-y-2">' + fases.map(function (f) {
    var largura = Math.max((f.total / max) * 100, 2);
    return '<div>' +
      '<div class="flex justify-between text-xs">' +
        '<span class="truncate pr-2">' + esc(f.nome) + '</span>' +
        '<span><b>' + num(f.total) + '</b> <span class="text-paipe-suave">· média ' + num(f.tempoMedioDias, 1) + ' d (n=' + f.amostraTempo + ')</span></span>' +
      '</div>' +
      '<div class="h-2.5 w-full rounded bg-slate-100"><div class="h-2.5 rounded" style="width:' + largura + '%;background:' + esc(f.cor) + '"></div></div>' +
      '</div>';
  }).join('') + '</div>';
}

/** Gráfico de linha em SVG: criados x concluídos por mês. */
function linhaTempo(dados) {
  if (!dados || dados.length < 2) return '<p class="text-sm text-paipe-suave">Sem dados suficientes.</p>';
  var larg = 560, alt = 220, pad = 30;
  var max = Math.max.apply(null, dados.map(function (d) { return Math.max(d.criados, d.concluidos); }).concat([1]));
  var ponto = function (i, v) {
    var x = pad + (i / (dados.length - 1)) * (larg - pad * 2);
    var y = alt - pad - (v / max) * (alt - pad * 2);
    return x.toFixed(1) + ',' + y.toFixed(1);
  };
  var serie = function (campo, cor) {
    return '<polyline fill="none" stroke="' + cor + '" stroke-width="2" points="' +
      dados.map(function (d, i) { return ponto(i, d[campo]); }).join(' ') + '"/>';
  };
  var rotulos = [0, Math.floor(dados.length / 2), dados.length - 1].map(function (i) {
    var x = pad + (i / (dados.length - 1)) * (larg - pad * 2);
    return '<text x="' + x.toFixed(1) + '" y="' + (alt - 8) + '" font-size="10" fill="#64748b" text-anchor="middle">' + dados[i].mes + '</text>';
  }).join('');

  return '<svg viewBox="0 0 ' + larg + ' ' + alt + '" class="w-full" style="max-height:240px">' +
    '<line x1="' + pad + '" y1="' + (alt - pad) + '" x2="' + (larg - pad) + '" y2="' + (alt - pad) + '" stroke="#e2e8f0"/>' +
    '<text x="4" y="' + (pad + 4) + '" font-size="10" fill="#64748b">' + max + '</text>' +
    serie('criados', '#2563eb') + serie('concluidos', '#22c55e') + rotulos +
    '</svg>' +
    '<div class="mt-1 flex gap-4 text-xs"><span class="text-[#2563eb]">● Criados</span><span class="text-[#22c55e]">● Concluídos</span></div>';
}

function tabelaSimples(cabecalho, linhas) {
  if (!linhas.length) return '<p class="text-sm text-paipe-suave">Sem dados.</p>';
  return '<table class="tabela"><thead><tr>' + cabecalho.map(function (c) { return '<th>' + c + '</th>'; }).join('') +
    '</tr></thead><tbody>' + linhas.map(function (l) {
      return '<tr>' + l.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>';
    }).join('') + '</tbody></table>';
}

    return chamar('api_lacunas').then(function (r) { E.lacunas = r; });
  }
  if (E.gerenciarSecao === 'auditoria') {
    return chamar('api_auditoria', E.auditoriaPagina || 1, 100).then(function (r) { E.auditoria = r; });
  }
  return Promise.resolve();
}

function irSecao(secao) {
  E.gerenciarSecao = secao;
  carregarAba();
}

function telaGerenciar() {
  var u = E.meta.usuario;
  var corpo = '';
  if (E.gerenciarSecao === 'usuarios') corpo = secaoUsuarios(u);
  else if (E.gerenciarSecao === 'fases') corpo = secaoFases();
  else if (E.gerenciarSecao === 'migracao') corpo = secaoMigracao();
  else corpo = secaoAuditoria();

  return '<div class="flex min-h-0 flex-1">' +
    '<nav class="w-60 shrink-0 border-r border-paipe-borda bg-white p-3">' +
      SECOES_GERENCIAR.map(function (s) {
        return '<button onclick="irSecao(\'' + s[0] + '\')" class="block w-full rounded-md px-3 py-2 text-left text-sm font-medium transition ' +
          (E.gerenciarSecao === s[0] ? 'bg-slate-100 text-paipe-texto' : 'text-paipe-suave hover:bg-slate-50') + '">' + s[1] + '</button>';
      }).join('') +
    '</nav>' +
    '<div class="rolagem flex-1 overflow-y-auto p-6">' + corpo + '</div></div>';
}

function secaoUsuarios(atual) {
  var ehAdmin = atual.papel === 'ADMIN';
  var lista = E.usuarios || [];
  return '<h2 class="mb-1 text-lg font-semibold">Usuários e permissões</h2>' +
    '<p class="mb-4 text-sm text-paipe-suave">ADMIN administra tudo · GESTOR move cards e aprova · ANALISTA cria e edita · LEITOR só consulta. Quem não estiver nesta lista entra como LEITOR.</p>' +
    (ehAdmin ?
      '<div class="painel mb-4 grid gap-3 p-4 md:grid-cols-4">' +
        '<input class="campo" id="novoEmail" placeholder="e-mail @empresa" />' +
        '<input class="campo" id="novoNome" placeholder="Nome" />' +
        '<select class="campo" id="novoPapel">' + ['ANALISTA', 'GESTOR', 'ADMIN', 'LEITOR'].map(function (p) { return '<option>' + p + '</option>'; }).join('') + '</select>' +
        '<button class="botao-primario justify-center" onclick="salvarUsuario()">Adicionar</button>' +
      '</div>' : '') +
    '<div class="painel overflow-hidden"><table class="tabela"><thead><tr>' +
      '<th>E-mail</th><th>Nome</th><th>Perfil</th><th>Último acesso</th><th>Situação</th></tr></thead><tbody>' +
      lista.map(function (x) {
        return '<tr><td>' + esc(x.email) + '</td><td>' + esc(x.nome) + '</td>' +
          '<td>' + (ehAdmin ?
            '<select class="campo w-32 py-1" onchange="trocarPapel(\'' + esc(x.email) + '\', this.value)">' +
            ['ADMIN', 'GESTOR', 'ANALISTA', 'LEITOR'].map(function (p) {
              return '<option' + (x.papel === p ? ' selected' : '') + '>' + p + '</option>';
            }).join('') + '</select>' : esc(x.papel)) + '</td>' +
          '<td class="text-xs">' + dataHora(x.ultimoAcesso) + '</td>' +
          '<td>' + (x.ativo ? 'Ativo' : 'Inativo') + '</td></tr>';
      }).join('') +
    '</tbody></table></div>';
}

function salvarUsuario() {
  var dados = { email: el('novoEmail').value, nome: el('novoNome').value, papel: el('novoPapel').value };
  chamar('api_salvarUsuario', dados)
    .then(function () { aviso('Usuário salvo.', 'ok'); return carregarAba(); })
    .catch(function (e) { aviso(e.message, 'erro'); });
}

function trocarPapel(email, papel) {
  chamar('api_salvarUsuario', { email: email, papel: papel })
    .then(function () { aviso('Perfil atualizado.', 'ok'); })
    .catch(function (e) { aviso(e.message, 'erro'); });
}

function secaoFases() {
  return '<h2 class="mb-1 text-lg font-semibold">Fases e fluxo</h2>' +
    '<p class="mb-4 text-sm text-paipe-suave">Os SLAs iniciais vieram da mediana observada nas exportações do Pipefy. Para alterar, edite a aba <b>FASES</b> da planilha (coluna slaDias) e recarregue esta tela.</p>' +
    '<div class="painel overflow-hidden"><table class="tabela"><thead><tr>' +
      '<th>Fase</th><th>Ordem</th><th>SLA (dias)</th><th>Final</th><th>Descrição</th></tr></thead><tbody>' +
      ((E.meta && E.meta.fases) || []).map(function (f) {
        return '<tr><td><span class="pilula" style="background:' + esc(corClara(f.cor)) + ';color:' + esc(f.cor) + '">' + esc(f.nome) + '</span></td>' +
          '<td>' + f.ordem + '</td><td>' + (f.slaDias || '—') + '</td><td>' + (f.final ? 'Sim' : 'Não') + '</td>' +
          '<td class="text-xs text-paipe-suave">' + esc(f.descricao || '') + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
    '<h3 class="mb-2 mt-6 text-sm font-semibold">Transições</h3>' +
    '<div class="painel overflow-hidden"><table class="tabela"><thead><tr>' +
      '<th>De</th><th>Para</th><th>Perfis</th><th>Campos obrigatórios</th></tr></thead><tbody>' +
      ((E.meta && E.meta.transicoes) || []).map(function (t) {
        return '<tr><td>' + esc(t.de) + '</td><td>' + esc(t.para) + '</td><td class="text-xs">' + esc(t.perfis.join(', ')) +
          '</td><td class="text-xs text-paipe-suave">' + esc(t.camposObrigatorios.join(', ') || '—') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
}

function secaoMigracao() {
  var l = E.lacunas || { resumo: [], itens: [] };
  return '<h2 class="mb-1 text-lg font-semibold">Migração e lacunas</h2>' +
    '<p class="mb-4 text-sm text-paipe-suave">Os desvios migrados vieram das 10 exportações do Pipefy. O que a exportação não continha está registrado aqui — nada foi inventado para preencher.</p>' +
    '<div class="painel mb-4 overflow-hidden"><table class="tabela"><thead><tr>' +
      '<th>Escopo</th><th>Campo</th><th>Ocorrências</th></tr></thead><tbody>' +
      l.resumo.map(function (r) {
        return '<tr><td>' + esc(r.escopo) + '</td><td class="font-mono text-xs">' + esc(r.campo) + '</td><td>' + r.total + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
    '<details><summary class="cursor-pointer text-sm text-paipe-azul">Detalhe das lacunas</summary>' +
      '<ul class="mt-2 space-y-1 text-xs text-paipe-suave">' + l.itens.map(function (i) {
        return '<li><b>' + esc(i.codigo || 'GLOBAL') + '</b> · ' + esc(i.campo) + ': ' + esc(i.motivo) +
          (i.fonte ? ' <span class="text-slate-400">— ' + esc(i.fonte) + '</span>' : '') + '</li>';
      }).join('') + '</ul></details>' +
    '<p class="mt-6 rounded-md border border-paipe-borda bg-slate-50 p-4 text-xs text-paipe-suave">' +
      'Para reimportar ou atualizar os dados: menu <b>Paipe &gt; Importar dados do Pipefy</b> na planilha. ' +
      'A importação é idempotente — rodar de novo atualiza em vez de duplicar.</p>';
}

function secaoAuditoria() {
  var a = E.auditoria || { itens: [], pagina: 1, paginas: 1, total: 0 };
  return '<h2 class="mb-4 text-lg font-semibold">Trilha de auditoria</h2>' +
    '<div class="painel overflow-hidden"><table class="tabela"><thead><tr>' +
      '<th>Quando</th><th>Usuário</th><th>Entidade</th><th>Registro</th><th>Operação</th><th>Detalhe</th></tr></thead><tbody>' +
      a.itens.map(function (l) {
        return '<tr><td class="whitespace-nowrap text-xs">' + dataHora(l.quando) + '</td>' +
          '<td class="text-xs">' + esc(l.usuario) + '</td><td>' + esc(l.entidade) + '</td>' +
          '<td class="font-mono text-xs">' + esc(l.registro) + '</td>' +
          '<td><span class="pilula bg-slate-100 text-slate-700">' + esc(l.operacao) + '</span></td>' +
          '<td class="max-w-md truncate text-xs text-paipe-suave" title="' + esc(l.detalhe) + '">' + esc(l.detalhe) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
    '<div class="mt-3 flex items-center gap-3">' +
      '<button class="botao" ' + (a.pagina <= 1 ? 'disabled' : '') + ' onclick="E.auditoriaPagina=' + (a.pagina - 1) + ';carregarAba()">Anterior</button>' +
      '<span class="text-sm text-paipe-suave">Página ' + a.pagina + ' de ' + a.paginas + ' · ' + num(a.total) + ' eventos</span>' +
      '<button class="botao" ' + (a.pagina >= a.paginas ? 'disabled' : '') + ' onclick="E.auditoriaPagina=' + (a.pagina + 1) + ';carregarAba()">Próxima</button>' +
    '</div>';
}

// ========================= DETALHE DO DESVIO ================================

var ABAS_DETALHE = [
  ['inicial', 'Formulário inicial'],
  ['pre', 'Pré-Trabalhos'],
  ['rca', 'Causa raiz (5 Porquês)'],
  ['plano', 'Plano de ação'],
  ['eficacia', 'Eficácia e conclusão'],
  ['historico', 'Histórico'],
  ['interacoes', 'Comentários']
];

function abrirCard(codigo) {
  if (event) event.stopPropagation();
  E.cardAberto = codigo;
  E.detalhe = null;
  E.detalheAba = 'inicial';
  E.editando = false;
  E.rascunho = {};
  desenharDetalhe();
  chamar('api_desvio', codigo)
    .then(function (d) { E.detalhe = d; desenharDetalhe(); })
    .catch(function (e) { aviso(e.message, 'erro'); fecharCard(); });
}

function fecharCard() {
  E.cardAberto = null;
  E.detalhe = null;
  el('camada').innerHTML = '';
  carregarAba();
}

/* Esc fecha o painel do card, como em qualquer janela sobreposta. */
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Escape') return;
  if (E.cardAberto) { fecharCard(); return; }
  if (el('camada') && el('camada').innerHTML) el('camada').innerHTML = '';
});

function irAbaDetalhe(aba) {
  E.detalheAba = aba;
  desenharDetalhe();
}

function alternarEdicao(ligar) {
  E.editando = ligar;
  if (!ligar) E.rascunho = {};
  desenharDetalhe();
}

function campoRascunho(campo, valor) {
  E.rascunho[campo] = valor;
}

function valorCampo(campo) {
  if (E.rascunho[campo] !== undefined) return E.rascunho[campo];
  return (E.detalhe && E.detalhe.campos[campo]) || '';
}

function desenharDetalhe() {
  if (!E.cardAberto) { el('camada').innerHTML = ''; return; }
  var d = E.detalhe;
  if (!d) {
    el('camada').innerHTML = painelLateral('<div class="grid flex-1 place-items-center p-10 text-sm text-paipe-suave">Carregando…</div>');
    return;
  }
  var c = d.campos;
  var fase = ((E.meta.fases || []).filter(function (f) { return f.nome === c.fase; })[0]) || { cor: '#64748b', nome: c.fase };
  var podeEditar = E.meta.usuario.podeEditar;

  var etiquetas = String(c.etiquetas || '').split('|').map(function (s) { return s.trim(); }).filter(String);

  var cabecalho =
    '<header class="sticky top-0 z-10 border-b border-paipe-borda bg-white px-6 py-4">' +
      '<div class="flex items-start gap-3">' +
        '<div class="min-w-0 flex-1">' +
          '<div class="mb-1 flex flex-wrap items-center gap-1.5">' +
            '<span class="pilula" style="background:' + esc(corClara(fase.cor)) + ';color:' + esc(fase.cor) + '">' + esc(c.fase) + '</span>' +
            etiquetas.map(function (e) { return '<span class="pilula bg-slate-100 text-slate-700">' + esc(e) + '</span>'; }).join('') +
            (c.origem === 'PIPEFY' ? '<span class="pilula bg-slate-100 text-slate-600" title="Registro migrado do Pipefy">migrado</span>' : '') +
          '</div>' +
          '<h2 class="text-lg font-semibold leading-tight">#' + esc(c.codigo) + ' — ' + esc(c.titulo) + '</h2>' +
          '<p class="mt-1 text-xs text-paipe-suave">Criado em ' + dataHora(c.criadoEm) + ' por ' + esc(c.criador || '—') +
            ' · ocorrência em ' + dataHora(c.ocorridoEm) +
            (Number(c.reaberturas) > 0 ? ' · reaberto ' + c.reaberturas + '×' : '') + '</p>' +
        '</div>' +
        '<div class="flex items-center gap-2">' +
          (podeEditar ? (E.editando ?
            '<button class="botao" onclick="alternarEdicao(false)">Cancelar</button>' +
            '<button class="botao-primario" onclick="salvarDesvio()">Salvar</button>' :
            '<button class="botao" onclick="alternarEdicao(true)">' + icone('lapis', 15) + ' Editar</button>') : '') +
          '<button class="rounded p-1.5 hover:bg-slate-100" onclick="fecharCard()">' + icone('fechar', 18) + '</button>' +
        '</div>' +
      '</div>' +
      (podeEditar && d.transicoes.length ?
        '<div class="mt-3 flex flex-wrap items-center gap-2">' +
          '<span class="text-xs font-semibold uppercase text-paipe-suave">Mover para</span>' +
          d.transicoes.map(function (t) {
            return '<button class="botao" ' + (t.permitida ? '' : 'disabled title="Seu perfil não pode executar esta transição"') +
              ' onclick="moverDaTela(\'' + esc(t.para) + '\')">' + icone('seta', 14) + ' ' + esc(t.para) + '</button>';
          }).join('') +
        '</div>' : '') +
      '<nav class="mt-3 flex flex-wrap gap-1 border-t border-paipe-borda pt-2">' +
        ABAS_DETALHE.map(function (a) {
          return '<button onclick="irAbaDetalhe(\'' + a[0] + '\')" class="rounded-md px-3 py-1.5 text-sm font-medium transition ' +
            (E.detalheAba === a[0] ? 'bg-slate-100 text-paipe-texto' : 'text-paipe-suave hover:bg-slate-50') + '">' + a[1] + '</button>';
        }).join('') +
      '</nav>' +
    '</header>';

  var corpo = '<div class="flex flex-col gap-4 p-6">' + conteudoDetalhe(d) +
    (d.lacunas.length ?
      '<section class="painel border-amber-200 bg-amber-50 p-4">' +
        '<h3 class="text-sm font-semibold text-amber-800">' + icone('alerta', 15) + ' Informação não disponível na migração</h3>' +
        '<ul class="mt-2 space-y-1 text-xs text-amber-900">' + d.lacunas.map(function (g) {
          return '<li><b>' + esc(g.campo) + '</b>: ' + esc(g.motivo) + (g.fonte ? ' <span class="text-amber-700">— origem: ' + esc(g.fonte) + '</span>' : '') + '</li>';
        }).join('') + '</ul></section>' : '') +
    '</div>';

  el('camada').innerHTML = painelLateral(cabecalho + corpo);
}

function painelLateral(interno) {
  return '<div class="fixed inset-0 z-40 flex justify-end" style="background:rgba(15,23,42,.3)" onclick="if(event.target===this)fecharCard()">' +
    '<div class="rolagem flex h-full w-full max-w-5xl flex-col overflow-y-auto bg-paipe-fundo shadow-2xl">' + interno + '</div></div>';
}

function conteudoDetalhe(d) {
  switch (E.detalheAba) {
    case 'inicial': return abaInicial();
    case 'pre': return abaPre();
    case 'rca': return abaRca();
    case 'plano': return abaPlano(d);
    case 'eficacia': return abaEficacia();
    case 'historico': return abaHistorico(d);
    default: return abaInteracoes(d);
  }
}

// ---------------------------- campos reutilizáveis --------------------------

function secao(titulo, descricao, campos) {
  return '<section class="painel p-4">' +
    '<header class="mb-3 border-b border-paipe-borda pb-2"><h3 class="text-sm font-semibold">' + titulo + '</h3>' +
    (descricao ? '<p class="text-xs text-paipe-suave">' + descricao + '</p>' : '') + '</header>' +
    '<div class="grid gap-4 md:grid-cols-2">' + campos + '</div></section>';
}

function campoTexto(rotulo, campo, opcoes) {
  opcoes = opcoes || {};
  var v = valorCampo(campo);
  var classe = opcoes.total ? 'md:col-span-2' : '';
  var corpo = E.editando
    ? (opcoes.linhas
      ? '<textarea class="campo" rows="' + opcoes.linhas + '" oninput="campoRascunho(\'' + campo + '\', this.value)">' + esc(v) + '</textarea>'
      : '<input class="campo" value="' + esc(v) + '" oninput="campoRascunho(\'' + campo + '\', this.value)" />')
    : '<p class="whitespace-pre-line rounded-md bg-slate-50 px-3 py-2 text-sm text-slate-700">' + (esc(v) || '—') + '</p>';
  return '<div class="' + classe + '"><label class="rotulo">' + rotulo + (opcoes.obrigatorio ? ' <span class="text-red-500">*</span>' : '') + '</label>' + corpo + '</div>';
}

function campoSelecao(rotulo, campo, itens, opcoes) {
  opcoes = opcoes || {};
  var v = valorCampo(campo);
  var corpo = E.editando
    ? '<select class="campo" onchange="campoRascunho(\'' + campo + '\', this.value)"><option value="">Selecione…</option>' +
      (itens || []).map(function (i) {
        var nome = i.nome !== undefined ? i.nome : i;
        return '<option value="' + esc(nome) + '"' + (v === nome ? ' selected' : '') + '>' + esc(nome) + '</option>';
      }).join('') + '</select>'
    : '<p class="rounded-md bg-slate-50 px-3 py-2 text-sm text-slate-700">' + (esc(v) || '—') + '</p>';
  return '<div class="' + (opcoes.total ? 'md:col-span-2' : '') + '"><label class="rotulo">' + rotulo +
    (opcoes.obrigatorio ? ' <span class="text-red-500">*</span>' : '') + '</label>' + corpo + '</div>';
}

function campoSimNao(rotulo, campo, comNaoSei) {
  var v = valorCampo(campo);
  var opcoes = comNaoSei === false ? ['Sim', 'Não'] : ['Sim', 'Não', 'Não sei'];
  var corpo = E.editando
    ? '<div class="flex gap-2">' + opcoes.map(function (o) {
        return '<button type="button" onclick="campoRascunho(\'' + campo + '\', \'' + o + '\');desenharDetalhe()" ' +
          'class="rounded-md border px-3 py-1.5 text-sm font-medium transition ' +
          (v === o ? 'border-paipe-azul bg-blue-50 text-paipe-azul' : 'border-paipe-borda bg-white hover:bg-slate-50') + '">' + o + '</button>';
      }).join('') + '</div>'
    : '<p class="rounded-md bg-slate-50 px-3 py-2 text-sm text-slate-700">' + (esc(v) || '—') + '</p>';
  return '<div><label class="rotulo">' + rotulo + '</label>' + corpo + '</div>';
}

function campoData(rotulo, campo, comHora) {
  var v = valorCampo(campo);
  var paraInput = v ? new Date(v).toISOString().slice(0, comHora ? 16 : 10) : '';
  var corpo = E.editando
    ? '<input type="' + (comHora ? 'datetime-local' : 'date') + '" class="campo" value="' + esc(paraInput) + '" ' +
      'onchange="campoRascunho(\'' + campo + '\', this.value ? new Date(this.value).toISOString() : \'\')" />'
    : '<p class="rounded-md bg-slate-50 px-3 py-2 text-sm text-slate-700">' + (comHora ? dataHora(v) : dataCurta(v)) + '</p>';
  return '<div><label class="rotulo">' + rotulo + '</label>' + corpo + '</div>';
}

// ------------------------------- abas do card -------------------------------

function abaInicial() {
  var m = E.meta;
  return secao('Identificação do desvio', '',
      campoTexto('Título', 'titulo', { total: true, obrigatorio: true }) +
      campoTexto('Descrição do Desvio', 'descricao', { total: true, linhas: 5, obrigatorio: true }) +
      campoTexto('Responsável pelo preenchimento', 'responsavelPreenchimento') +
      campoTexto('Responsáveis', 'responsaveis') +
      campoData('Data e hora da ocorrência', 'ocorridoEm', true) +
      campoData('Data e hora do preenchimento', 'preenchidoEm', true)) +
    secao('Localização e classificação', '',
      campoSelecao('Unidade', 'unidade', m.unidades, { obrigatorio: true }) +
      campoSelecao('Área', 'area', m.areas, { obrigatorio: true }) +
      campoSelecao('Setor', 'setor', m.setores) +
      campoTexto('Área/equipamento em que ocorreu', 'areaEquipamento') +
      campoSelecao('Categoria do desvio', 'categoria', m.categorias, { obrigatorio: true }) +
      campoSelecao('Criticidade do Desvio', 'criticidade', m.criticidades, { obrigatorio: true })) +
    secao('Triagem', 'Mesmas perguntas de gatilho do formulário original.',
      campoSimNao('Algum gatilho operacional foi disparado?', 'gatilhoOperacional') +
      campoSimNao('Alguma falha/quebra de equipamento?', 'falhaEquipamento') +
      campoSimNao('Reclamação de cliente / contaminação / produto não conforme?', 'reclamacaoCliente') +
      campoSimNao('Houve vazamento de produto (exceto óleo lubrificante)?', 'vazamentoProduto') +
      campoSimNao('Houve incidente de segurança, saúde ou meio ambiente?', 'incidenteSHE') +
      campoSimNao('Desvio relacionado com produto acabado?', 'produtoAcabado') +
      (valorCampo('produtoAcabado') === 'Sim' || valorCampo('quantidadeAfetada')
        ? campoTexto('Quantidade afetada', 'quantidadeAfetada') + campoSelecao('Unidade de medida', 'unidadeMedida', E.meta.unidadesMedida)
        : ''));
}

function abaPre() {
  return secao('Avaliação preliminar e restrições', 'Etapa de Pré-Trabalhos.',
    campoSimNao('Avaliação da Formulação será necessária?', 'formulacaoNecessaria', false) +
    campoData('Data da Avaliação da Formulação', 'dataFormulacao') +
    campoTexto('Descreva a Restrição', 'restricao', { total: true, linhas: 4 }) +
    campoTexto('Responsável pela Avaliação', 'responsavelAvaliacao') +
    campoData('Data da aprovação da Avaliação', 'aprovacaoAvaliacaoEm'));
}

function abaRca() {
  var v = valorCampo('rcaRealizado');
  var cabecalho = '<div class="md:col-span-2"><label class="rotulo">Análise de causa raiz realizada?</label>' +
    (E.editando

function editarAcao(seq) {
  var a = seq ? E.detalhe.acoes.filter(function (x) { return x.seq === seq; })[0] : {};
  a = a || {};
  var campo = function (id, rotulo, tipo, valor, extra) {
    if (tipo === 'select') {
      return '<div><label class="rotulo">' + rotulo + '</label><select class="campo" id="ac_' + id + '">' +
        '<option value="">—</option>' + extra.map(function (o) {
          return '<option' + (valor === o ? ' selected' : '') + '>' + esc(o) + '</option>';
        }).join('') + '</select></div>';
    }
    if (tipo === 'textarea') {
      return '<div class="md:col-span-2"><label class="rotulo">' + rotulo + '</label>' +
        '<textarea class="campo" rows="' + (extra || 2) + '" id="ac_' + id + '">' + esc(valor) + '</textarea></div>';
    }
    if (tipo === 'date') {
      return '<div><label class="rotulo">' + rotulo + '</label><input type="date" class="campo" id="ac_' + id + '" value="' +
        (valor ? new Date(valor).toISOString().slice(0, 10) : '') + '" /></div>';
    }
    return '<div><label class="rotulo">' + rotulo + '</label><input class="campo" id="ac_' + id + '" value="' + esc(valor) + '" /></div>';
  };

  el('editorAcao').innerHTML = '<section class="painel border-blue-200 p-4">' +
    '<h4 class="mb-3 text-sm font-semibold">' + (seq ? 'Editando ação ' + seq : 'Nova ação') + '</h4>' +
    '<div class="grid gap-4 md:grid-cols-2">' +
      campo('possivelCausa', 'Possível causa', 'textarea', a.possivelCausa || '', 2) +
      campo('acao', 'Ação', 'textarea', a.acao || '', 3) +
      campo('tipo', 'Tipo de ação', 'select', a.tipo || '', E.meta.tiposAcao) +
      campo('responsaveis', 'Responsável', 'text', a.responsaveis || '') +
      campo('prazo', 'Prazo', 'date', a.prazo || '') +
      campo('concluidoEm', 'Concluído em', 'date', a.concluidoEm || '') +
      campo('investimento', 'Investimento?', 'select', a.investimento || '', ['Sim', 'Não']) +
      campo('valorInvestimento', 'Valor do investimento (R$)', 'text', a.valorInvestimento || '') +
      campo('comentarios', 'Comentários', 'textarea', a.comentarios || '', 2) +
      campo('evidencia', 'Evidência', 'textarea', a.evidencia || '', 2) +
    '</div>' +
    '<div class="mt-3 flex justify-end gap-2">' +
      '<button class="botao" onclick="document.getElementById(\'editorAcao\').innerHTML=\'\'">Cancelar</button>' +
      '<button class="botao-primario" onclick="salvarAcao(' + (seq || 0) + ')">Salvar ação</button>' +
    '</div></section>';
}

function salvarAcao(seq) {
  var v = function (id) { var e = el('ac_' + id); return e ? e.value : ''; };
  var dados = {
    seq: seq || '', possivelCausa: v('possivelCausa'), acao: v('acao'), tipo: v('tipo'),
    responsaveis: v('responsaveis'), prazo: v('prazo'), concluidoEm: v('concluidoEm'),
    investimento: v('investimento'), valorInvestimento: v('valorInvestimento'),
    comentarios: v('comentarios'), evidencia: v('evidencia')
  };
  ocupado(true);
  chamar('api_salvarAcao', E.cardAberto, dados)
    .then(function () { ocupado(false); aviso('Ação salva.', 'ok'); return recarregarDetalhe(); })
    .catch(function (e) { ocupado(false); aviso(e.message, 'erro'); });
}

function excluirAcao(seq) {
  if (!confirm('Excluir a ação ' + seq + '?')) return;
  chamar('api_excluirAcao', E.cardAberto, seq)
    .then(function () { aviso('Ação excluída.', 'ok'); return recarregarDetalhe(); })
    .catch(function (e) { aviso(e.message, 'erro'); });
}

function recarregarDetalhe() {
  return chamar('api_desvio', E.cardAberto).then(function (d) {
    E.detalhe = d;
    E.rascunho = {};
    desenharDetalhe();
  });
}

function salvarDesvio() {

    .then(function (r) {
      ocupado(false);
      aviso(r.alteracoes + ' campo(s) salvo(s).', 'ok');
      E.editando = false;
      return recarregarDetalhe();

}

function comentar() {

function criarDesvio() {
  var campos = ['titulo', 'descricao', 'responsavelPreenchimento', 'ocorridoEm', 'unidade', 'area', 'setor',
    'areaEquipamento', 'categoria', 'criticidade', 'gatilhoOperacional', 'falhaEquipamento', 'reclamacaoCliente',
    'vazamentoProduto', 'incidenteSHE', 'produtoAcabado', 'quantidadeAfetada', 'unidadeMedida'];
  var dados = {};
  campos.forEach(function (c) {
    var e = el('nd_' + c);
    if (e && e.value) dados[c] = c === 'ocorridoEm' ? new Date(e.value).toISOString() : e.value;
  });
  ocupado(true);
  chamar('api_criarDesvio', dados)
    .then(function (r) {
      ocupado(false);
      aviso('Desvio ' + r.codigo + ' criado.', 'ok');
      abrirCard(r.codigo);
    })
    .catch(function (e) { ocupado(false); aviso(e.message, 'erro'); });
}


/* ===========================================================================
 *  FORMULÁRIO PÚBLICO — réplica do formulário compartilhável do Pipefy
 * ===========================================================================
 *  Usa `chamar`, `esc` e `aviso`, que já existem nas duas versões:
 *   • na planilha, a página Formulario.html define os três antes de incluir
 *     este arquivo;
 *   • no site, eles já vêm do próprio sistema (a mesma página serve as duas
 *     telas, separadas por #formulario no endereço).
 * ======================================================================== */

var FM_DEF = null;
var FM_VALORES = {};

function fmVisivel(c) {
  return !c.condicao || FM_VALORES[c.condicao.campo] === c.condicao.valor;
}

function fmDefinir(campo, valor) {
  FM_VALORES[campo] = valor;
  fmDesenhar();
}

function fmDesenhar() {
  var campos = FM_DEF.campos.filter(fmVisivel).map(function (c) {
    var v = FM_VALORES[c.id] || '';
    var corpo;
    if (c.tipo === 'textoLongo') {
      corpo = '<textarea class="campo" rows="5" oninput="fmDefinirSemRedesenhar(\'' + c.id + '\', this.value)">' + esc(v) + '</textarea>';
    } else if (c.tipo === 'datahora') {
      corpo = '<input type="datetime-local" class="campo" value="' + esc(v) + '" oninput="fmDefinirSemRedesenhar(\'' + c.id + '\', this.value)" />';
    } else if (c.tipo === 'selecao' || c.tipo === 'selecaoFixa') {
      var itens = FM_DEF.opcoes[c.origem] || [];
      corpo = '<select class="campo" onchange="fmDefinir(\'' + c.id + '\', this.value)"><option value="">Selecione…</option>' +
        itens.map(function (i) {
          var nome = i.nome !== undefined ? i.nome : i;
          return '<option' + (v === nome ? ' selected' : '') + '>' + esc(nome) + '</option>';
        }).join('') + '</select>';
    } else if (c.tipo === 'simNao') {
      corpo = '<div class="flex gap-2">' + ['Sim', 'Não', 'Não sei'].map(function (o) {
        return '<button type="button" onclick="fmDefinir(\'' + c.id + '\', \'' + o + '\')" class="rounded-md border px-4 py-2 text-sm font-medium ' +
          (v === o ? 'border-paipe-azul bg-blue-50 text-paipe-azul' : 'border-paipe-borda bg-white') + '">' + o + '</button>';
      }).join('') + '</div>';
    } else {
      corpo = '<input class="campo" value="' + esc(v) + '" oninput="fmDefinirSemRedesenhar(\'' + c.id + '\', this.value)" />';
    }
    return '<div><label class="mb-1 block text-sm font-medium">' + esc(c.rotulo) +
      (c.obrigatorio ? ' <span class="text-red-500">*</span>' : '') + '</label>' + corpo + '</div>';
  }).join('');

  document.getElementById('raiz').innerHTML =
    '<div class="py-10"><div class="painel mx-auto max-w-2xl p-8">' +
      '<p class="text-2xl font-bold lowercase tracking-tight text-paipe-roxo">paipe</p>' +
      '<h1 class="mt-2 text-xl font-semibold">' + esc(FM_DEF.titulo) + '</h1>' +
      '<p class="mb-6 text-sm text-paipe-suave">' + esc(FM_DEF.subtitulo) + '</p>' +
      '<div class="space-y-4">' + campos + '</div>' +
      '<button class="botao-primario mt-6 w-full justify-center" id="fmEnviar" onclick="fmEnviar()">Enviar desvio</button>' +
    '</div></div>';
}

/** Digitar não pode redesenhar a tela (o cursor se perderia). */
function fmDefinirSemRedesenhar(campo, valor) {
  FM_VALORES[campo] = valor;
}

function fmEnviar() {
  var faltando = FM_DEF.campos.filter(fmVisivel).filter(function (c) {
    return c.obrigatorio && !FM_VALORES[c.id];
  });
  if (faltando.length) {
    aviso('Preencha: ' + faltando.map(function (c) { return c.rotulo; }).join(', '), 'erro');
    return;
  }
  var dados = {};
  FM_DEF.campos.filter(fmVisivel).forEach(function (c) {
    if (FM_VALORES[c.id]) {
      dados[c.id] = c.tipo === 'datahora' ? new Date(FM_VALORES[c.id]).toISOString() : FM_VALORES[c.id];
    }
  });
  var botao = document.getElementById('fmEnviar');
  botao.disabled = true;
  botao.textContent = 'Enviando…';
  chamar('api_enviarFormularioPublico', dados)
    .then(function (r) {
      document.getElementById('raiz').innerHTML =
        '<div class="grid min-h-screen place-items-center px-4"><div class="painel max-w-md p-8 text-center">' +
          '<p class="text-5xl">✅</p>' +
          '<h1 class="mt-3 text-xl font-semibold">Desvio registrado</h1>' +
          '<p class="mt-1 text-sm text-paipe-suave">O desvio recebeu o código <b>#' + esc(r.codigo) +
            '</b> e já está na fase inicial do fluxo.</p>' +
          '<button class="botao-primario mx-auto mt-5" onclick="fmIniciar()">Registrar outro desvio</button>' +
        '</div></div>';
    })
    .catch(function (e) {
      botao.disabled = false;
      botao.textContent = 'Enviar desvio';
      aviso(e.message, 'erro');
    });
}

function fmIniciar() {
  FM_VALORES = {};
  document.getElementById('raiz').innerHTML =
    '<div class="grid min-h-screen place-items-center"><div class="text-center">' +
    '<p class="text-3xl font-bold lowercase tracking-tight text-paipe-roxo">paipe</p>' +
    '<p class="mt-2 text-sm text-paipe-suave">Carregando o formulário…</p></div></div>';
  chamar('api_formularioPublico')
    .then(function (d) { FM_DEF = d; fmDesenhar(); })
    .catch(function (e) {
      document.getElementById('raiz').innerHTML =
        '<div class="grid min-h-screen place-items-center px-4"><div class="painel max-w-md p-8 text-center">' +
        '<p class="font-semibold text-red-600">Não foi possível abrir o formulário</p>' +
        '<p class="mt-2 text-sm text-paipe-suave">' + esc(e.message) + '</p></div></div>';
    });
}


/* ---------------------------------------------------------------------------
 * Entrada no sistema: e-mail e senha conferidos contra a aba USUARIOS.
 * ------------------------------------------------------------------------ */

function telaCentral(interno) {
  document.getElementById('raiz').innerHTML =
    '<div class="grid min-h-screen place-items-center px-4" style="background:linear-gradient(135deg,#f1f5f9,#e2e8f0)">' +
    '<div class="painel w-full max-w-sm p-7">' + interno + '</div></div>';
  if (document.getElementById('camada')) document.getElementById('camada').innerHTML = '';
}

function mostrarLogin(mensagem) {
  telaCentral(
    '<p class="text-3xl font-bold lowercase tracking-tight text-paipe-roxo">paipe</p>' +
    '<p class="mb-6 text-sm text-paipe-suave">Gerenciamento dos Desvios</p>' +
    (mensagem ? '<p class="mb-3 rounded border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-800">' + esc(mensagem) + '</p>' : '') +
    '<label class="rotulo">E-mail</label>' +
    '<input class="campo mb-3" id="loginEmail" type="email" autocomplete="username" />' +
    '<label class="rotulo">Senha</label>' +
    '<input class="campo mb-4" id="loginSenha" type="password" autocomplete="current-password" />' +
    '<p id="loginErro" class="mb-3 hidden rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"></p>' +
    '<button class="botao-primario w-full justify-center" id="loginBotao">Entrar</button>' +
    '<p class="mt-4 text-center text-xs text-paipe-suave">Esqueceu a senha? Peça a um administrador para gerar uma nova.</p>'
  );
  var entrar = function () { fazerLogin(); };
  document.getElementById('loginBotao').addEventListener('click', entrar);
  ['loginEmail', 'loginSenha'].forEach(function (id) {
    document.getElementById(id).addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') entrar();
    });
  });
  document.getElementById('loginEmail').focus();
}

function erroLogin(texto) {
  var alvo = document.getElementById('loginErro');
  if (!alvo) return;
  alvo.textContent = texto;
  alvo.classList.remove('hidden');
}

function fazerLogin() {
  var email = document.getElementById('loginEmail').value.trim();
  var senha = document.getElementById('loginSenha').value;
  var botao = document.getElementById('loginBotao');
  botao.disabled = true;
  botao.textContent = 'Entrando…';
  enviarApi('login', { email: email, senha: senha })
    .then(function (r) {
      guardarToken(r.token);
      if (r.precisaTrocarSenha) return mostrarTrocaSenha(true);
      iniciar();
    })
    .catch(function (e) {
      botao.disabled = false;
      botao.textContent = 'Entrar';
      erroLogin(e.message);
    });
}

function mostrarTrocaSenha(obrigatoria) {
  telaCentral(
    '<p class="text-xl font-semibold">' + (obrigatoria ? 'Crie sua senha' : 'Trocar senha') + '</p>' +
    '<p class="mb-5 text-sm text-paipe-suave">' +
      (obrigatoria ? 'Este é o seu primeiro acesso. Escolha uma senha só sua.' : 'Escolha uma nova senha de pelo menos 8 caracteres.') + '</p>' +
    '<label class="rotulo">Senha atual</label>' +
    '<input class="campo mb-3" id="tsAtual" type="password" autocomplete="current-password" />' +
    '<label class="rotulo">Nova senha</label>' +
    '<input class="campo mb-3" id="tsNova" type="password" autocomplete="new-password" />' +
    '<label class="rotulo">Repita a nova senha</label>' +
    '<input class="campo mb-4" id="tsRepete" type="password" autocomplete="new-password" />' +
    '<p id="loginErro" class="mb-3 hidden rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700"></p>' +
    '<button class="botao-primario w-full justify-center" id="tsBotao">Salvar senha</button>' +
    (obrigatoria ? '' : '<button class="botao mt-2 w-full justify-center" onclick="iniciar()">Cancelar</button>')
  );
  document.getElementById('tsBotao').addEventListener('click', function () {
    var nova = document.getElementById('tsNova').value;
    if (nova.length < 8) return erroLogin('A nova senha precisa ter pelo menos 8 caracteres.');
    if (nova !== document.getElementById('tsRepete').value) return erroLogin('As duas senhas não são iguais.');
    var botao = document.getElementById('tsBotao');
    botao.disabled = true;
    botao.textContent = 'Salvando…';
    enviarApi('trocarSenha', { senhaAtual: document.getElementById('tsAtual').value, senhaNova: nova })
      .then(function () { aviso('Senha alterada.', 'ok'); iniciar(); })
      .catch(function (e) {
        botao.disabled = false;
        botao.textContent = 'Salvar senha';
        erroLogin(e.message);
      });
  });
  document.getElementById('tsAtual').focus();
}

function sair() {
  guardarToken(null);
  mostrarLogin('');
}

/* Acrescenta "Trocar senha" e "Sair" ao cabeçalho desenhado pelo projeto. */
var desenharDoProjeto = desenhar;
desenhar = function () {
  desenharDoProjeto();
  var avatar = document.querySelector('header .rounded-full.bg-paipe-roxo');
  if (!avatar || document.getElementById('menuSessao')) return;
  var caixa = document.createElement('div');
  caixa.id = 'menuSessao';
  caixa.className = 'flex items-center gap-1';
  caixa.innerHTML =
    '<button class="botao px-2 py-1 text-xs" onclick="mostrarTrocaSenha(false)" title="Trocar minha senha">Senha</button>' +
    '<button class="botao px-2 py-1 text-xs" onclick="sair()" title="Sair do sistema">Sair</button>';
  avatar.parentNode.insertBefore(caixa, avatar.nextSibling);
};

/* ---------------------------------------------------------------------------
 * Rotas do site. Tudo mora na mesma página:
 *   (sem #)       -> sistema, com login
 *   #formulario   -> formulário público, sem login
 * ------------------------------------------------------------------------ */
function abrirRota() {
  if (!enderecoApi() || enderecoApi().indexOf('http') !== 0) {
    telaCentral(
      '<p class="text-lg font-semibold text-red-600">Falta configurar o endereço do sistema</p>' +
      '<p class="mt-2 text-sm text-paipe-suave">Abra este arquivo <b>index.html</b>, procure por <b>COLE_AQUI</b> no começo e coloque no lugar a URL do App da Web do Apps Script (termina em <b>/exec</b>).</p>'
    );
    return;
  }
  if ((location.hash || '').replace('#', '') === 'formulario') {
    if (document.getElementById('camada')) document.getElementById('camada').innerHTML = '';
    fmIniciar();
    return;
  }
  if (tokenAtual()) iniciar();
  else mostrarLogin('');
}

window.addEventListener('DOMContentLoaded', abrirRota);
window.addEventListener('hashchange', abrirRota);

    </script>
